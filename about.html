  <script>try{if(sessionStorage.getItem('postcard-cloud-arrival')===location.pathname){document.documentElement.classList.add('cloud-arrival');window.cloudFallback=setTimeout(()=>document.documentElement.classList.remove('cloud-arrival'),3000)}}catch{}</script>
  <link rel="preload" as="image" href="assets/banff/painting-v7.webp" fetchpriority="high">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="paper.css">

<body>
  <main aria-label="Lake Louise, painted and alive">
    <h1 class="sr-only" tabindex="-1">About — Lake Louise</h1>
    <p class="sr-only">A brush painting of sunlit Banff peaks, turquoise lake reflections, shoreline conifers, and canoes. Animation follows your reduced motion preference.</p>
    <canvas id="landscape" aria-hidden="true"></canvas>
    <canvas id="motion" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="trail-companion" role="img" aria-label="A painted pika perched on the top of a wooden trail post">
      <img class="trail-post" src="assets/banff/post-source-brush-v5.webp" alt="" width="560" height="306">
      <img class="trail-pika" src="assets/banff/pika-source-brush-v5.webp" alt="" width="420" height="280">

  <button type="button" class="content-slip" aria-controls="paper-sheet" aria-expanded="false" aria-haspopup="dialog">

  </button>

      <button type="button" class="paper-collapse" aria-label="Collapse paper" autofocus>
        <svg class="paper-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg>
      </button>
    </header>
    <div class="paper-content" tabindex="0">

    </div>
  </dialog>
