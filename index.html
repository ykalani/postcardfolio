<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#95b8c8">
  <meta name="description" content="Yosemite Valley, painted and alive. A study of granite, wind, clouds, and falling water.">
  <title>Yash Kalani</title>
  <script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches){document.documentElement.classList.add('cloud-arrival');window.cloudFallback=setTimeout(()=>document.documentElement.classList.remove('cloud-arrival'),10000)}</script>
  <link rel="preload" as="image" href="assets/yosemite-display-brush3.webp?v=brush-3" fetchpriority="high">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cloud-transition.css">
  <link rel="stylesheet" href="postcard.css">
  <script src="scene.js" defer></script>
  <script src="cloud-transition.js" defer></script>
  <script src="postcard.js" defer></script>
</head>
<body>
  <main aria-label="An animated brush painting of Yosemite Valley">
    <h1 class="sr-only" tabindex="-1">Yosemite Valley</h1>
    <p class="sr-only">Half Dome rises beyond the forest, Bridalveil Fall flows beneath Cathedral Rocks, a foreground pine bends in the wind, and clouds cross the sky. Animation follows your reduced motion preference.</p>
    <canvas id="landscape" aria-hidden="true"></canvas>
    <canvas id="motion" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
  </main>
  <div class="postcard-stage">
    <article class="postcard" id="postcard" aria-labelledby="postcard-name">
      <div class="postcard-stamp"><img src="assets/pfp_stamp.webp" alt="Yash Kalani" width="65" height="79"></div>
      <h2 id="postcard-name">Yash Kalani</h2>
      <button type="button" class="postcard-close" id="put-away" aria-label="Close postcard" aria-controls="postcard">×</button>
    </article>
    <button type="button" class="postcard-return" id="show-postcard" aria-label="Open postcard from Yash" aria-controls="postcard" hidden>
      <img src="assets/yosemite-display-brush3.webp?v=brush-3" alt="" width="80" height="80">
      <span class="postcard-return-address"><span class="postcard-return-name">Yash Kalani</span><span class="postcard-return-lines" aria-hidden="true"></span></span>
    </button>
  </div>
  <nav class="scene-nav" aria-label="Portfolio"><a href="./" data-cloud-link aria-current="page">home</a><a href="experiences" data-cloud-link>experience</a><a href="projects" data-cloud-link>projects</a><a href="writing" data-cloud-link>writing</a><a href="tech-blog" data-cloud-link>tech blog</a><a href="about" data-cloud-link>about</a></nav>
</body>
</html>
