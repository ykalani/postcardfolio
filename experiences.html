<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#42404b">
  <meta name="description" content="A painted dusk view into Halemaʻumaʻu, with glowing lava crust and rising volcanic gas.">
  <title>Yash Kalani</title>
  <script>try{if(sessionStorage.getItem('postcard-cloud-arrival')===location.pathname){document.documentElement.classList.add('cloud-arrival');window.cloudFallback=setTimeout(()=>document.documentElement.classList.remove('cloud-arrival'),3000)}}catch{}</script>
  <link rel="preload" as="image" href="assets/hawaii-volcanoes/painting-v5.webp" fetchpriority="high">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="paper.css">
  <link rel="stylesheet" href="postcard.css">
  <script src="postcard.js" defer></script>
  <script src="paper.js" defer></script>
  <link rel="stylesheet" href="cloud-transition.css">
  <script type="module" src="scenes/hawaii-volcanoes.js"></script>
  <script src="cloud-transition.js" defer></script>
</head>
<body>
  <main aria-label="Hawaiʻi Volcanoes, painted and alive">
    <h1 class="sr-only" tabindex="-1">Experience — Hawaiʻi Volcanoes</h1>
    <p class="sr-only">A painted dusk view into Halemaʻumaʻu, with glowing lava crust and rising volcanic gas. Animation follows your reduced motion preference.</p>
    <canvas id="landscape" aria-hidden="true"></canvas>
    <canvas id="motion" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
  </main>
  <button type="button" class="content-slip" aria-controls="paper-sheet" aria-expanded="false" aria-haspopup="dialog">
    <span>Experience</span>
    <svg class="paper-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 15 7-7 7 7"/></svg>
  </button>
  <dialog class="paper-sheet" id="paper-sheet" aria-labelledby="paper-title">
    <header class="paper-sheet-header">
      <button type="button" class="paper-collapse" aria-label="Collapse paper" autofocus>
        <svg class="paper-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg>
      </button>
    </header>
    <div class="paper-content" tabindex="0">
      <h2 id="paper-title">Experience</h2>
      <!-- Add experience content here. This area scrolls beneath the collapse arrow. -->
    </div>
  </dialog>
  <div class="postcard-stage">
    <article class="postcard" id="postcard" hidden aria-labelledby="postcard-name">
      <div class="postcard-stamp"><img src="assets/pfp_stamp.webp" alt="Yash Kalani" width="65" height="79"></div>
      <h2 id="postcard-name">Yash Kalani</h2>
      <p class="postcard-location">Hawaiʻi Volcanoes, Hawaiʻi</p>
      <button type="button" class="postcard-close" id="put-away" aria-label="Close postcard" aria-controls="postcard">×</button>
    </article>
    <button type="button" class="postcard-return" id="show-postcard" aria-label="Open postcard from Yash" aria-controls="postcard">
      <img src="assets/pfp_stamp.webp" alt="" width="54" height="60">
      <span class="postcard-return-address"><span class="postcard-return-name">Yash Kalani</span><span class="postcard-return-location">Hawaiʻi Volcanoes, Hawaiʻi</span></span>
    </button>
  </div>
  <nav class="scene-nav" aria-label="Portfolio"><a href="./" data-cloud-link>home</a><a href="experiences" data-cloud-link aria-current="page">experience</a><a href="projects" data-cloud-link>projects</a><a href="writing" data-cloud-link>writing</a><a href="tech-blog" data-cloud-link>tech blog</a><a href="about" data-cloud-link>about</a></nav>
</body>
</html>
